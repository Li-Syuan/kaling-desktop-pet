<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>一起玩 · 十種小日子</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f5ec;color:#294936;font:16px/1.65 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1200px;margin:auto;padding:38px 24px}a{color:#386b50}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:38px;letter-spacing:2px;line-height:1.25;margin:12px 0}.eyebrow{font-size:12px;letter-spacing:3px;color:#607b64}p{color:#5c7060}.layout{display:grid;grid-template-columns:205px 1fr;gap:28px;margin:30px 0}nav{display:flex;flex-direction:column;gap:8px}button,select{font:inherit;border:1px solid #bdcfb6;border-radius:10px;padding:10px 13px;background:#e8efdf;color:#284a36;cursor:pointer}nav button{text-align:left}button[aria-pressed=true]{background:#396c50;color:white;border-color:#396c50}button:focus-visible,select:focus-visible{outline:3px solid #c47e49;outline-offset:3px}figure{margin:0;background:#e7efdc;border-radius:24px;overflow:hidden}figure img{width:100%;display:block;aspect-ratio:800/460;object-fit:contain}h2{margin:0 0 8px;font-size:27px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.caption{padding:14px 18px;color:#566d5c;font-size:13px;background:#edf1e5}.instruction{min-height:75px}.hint{padding:16px 20px;background:#eee7d7;border-radius:14px;font-size:14px}footer{border-top:1px solid #ced9c4;padding-top:20px;font-size:13px;color:#788372}@media(max-width:760px){header{display:block}main{padding:24px 16px}h1{font-size:29px}.layout{grid-template-columns:1fr;gap:18px}nav{display:grid;grid-template-columns:repeat(2,1fr)}nav button{font-size:14px;padding:8px}h2{font-size:24px}}</style>
<main><header><div><div class="eyebrow">DESKTOP COMPANIONS / VERSION 1.8</div><h1>今天，想一起玩什麼？</h1><p>五位夥伴，十種把平常日子變可愛的小玩法。</p></div><a href="preview.html">角色動畫圖鑑 ↗</a></header>
<div class="layout"><nav id="features" aria-label="十種玩法"></nav><section><h2 id="title"></h2><p class="instruction" id="instruction"></p><figure><img id="scene" alt=""><figcaption class="caption" id="caption">實際 Windows WPF 畫面</figcaption></figure><div class="toolbar" id="variants"></div></section></div>
<p class="hint">這裡是可離線切換的實際畫面預覽。親手玩：完整解壓 ZIP → 雙擊 Start.bat → 右鍵角色 →「一起玩 · 十種小日子…」。<br>遊玩時桌面角色會收起，關閉視窗後回到原本位置；各角色分開記錄最高分、花、魚和回憶。</p>
<footer><a href="docs/PLAY.md">完整操作說明</a> · <a href="docs/PLAY-VALIDATION.md">驗收紀錄</a> · <a href="https://github.com/Li-Syuan/kaling-desktop-pet/releases/tag/v1.8.0">Windows 下載</a><p>綠水靈保留黑色圓眼內的金色十字。角色比例與原衣裝沿用確認稿；本版新增道具、場景與互動。新楓之谷同人作品，非官方產品。</p></footer></main>
<script>
const features=[{"id": "bubble", "title": "泡泡追逐", "description": "點破漂浮泡泡，和夥伴追著跳。30 秒挑戰，連續命中有加分。", "primary": "開始追泡泡", "image": "docs/play-slime-bubble.png"}, {"id": "snack", "title": "接點心", "description": "移動滑鼠帶夥伴接餅乾、閃開石頭。完成且接滿三塊，夥伴會吃一塊點心。", "primary": "開始接點心", "image": "docs/play-snack-active.png"}, {"id": "boxes", "title": "紙箱猜猜樂", "description": "記住夥伴躲的箱子，交換位置後點選。三輪看看能找到幾次。", "primary": "開始找夥伴", "image": "docs/play-boxes-found.png"}, {"id": "fishing", "title": "池塘釣魚", "description": "先下竿，浮標沉下去時點畫面或按拉竿。收集四種水中朋友。", "primary": "下一竿", "image": "docs/play-fishing-caught.png"}, {"id": "garden", "title": "盆栽花園", "description": "點花盆、選種子、澆水。累積四分鐘有水的陪伴時間就開花；離開不枯死。", "primary": "種下種子", "image": "docs/play-garden-flower.png"}, {"id": "rhythm", "title": "節奏跳跳", "description": "光圈碰到金環時點畫面或按空白鍵。十拍之後，看看今天的默契。", "primary": "開始十拍", "image": "docs/play-rhythm-active.png"}, {"id": "weather", "title": "窗外天氣", "description": "晴天、雨、雪與星空，挑一種今天想看的天空。所有玩法沿用這個天氣。", "primary": "換個心情", "image": "docs/play-weather-sun.png"}, {"id": "picnic", "title": "野餐時光", "description": "選好點心，一起鋪野餐墊、吃喝、看雲和打盹。可以隨時收拾回家。", "primary": "開始野餐", "image": "docs/play-picnic-pudding.png"}, {"id": "photo", "title": "拍照相簿", "description": "選姿勢、相框和短句，拍下一張明信片。只拍本程式畫面，可另存 PNG。", "primary": "拍一張明信片", "image": "docs/play-postcard-export.png"}, {"id": "journal", "title": "生活日記與紀念章", "description": "遊戲成績、釣獲、花朵和野餐會寫進日記；每位夥伴各自收集 12 枚紀念章。", "primary": "翻閱回憶", "image": "docs/play-journal.png"}];
const $=id=>document.getElementById(id);
function show(image,label){$('scene').src=image;$('scene').alt=label;$('caption').textContent=label+' · 實際 WPF 畫面';}
function variant(label,image){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{show(image,label);for(const v of $('variants').children)v.setAttribute('aria-pressed',v===b)};$('variants').append(b);return b;}
function select(f){$('title').textContent=f.title;$('instruction').textContent=f.description;show(f.image,f.title);$('variants').replaceChildren();for(const b of $('features').children)b.setAttribute('aria-pressed',b.dataset.id===f.id);
 if(f.id==='bubble'){for(const [id,name] of [['ren','蓮'],['kaling','咖凌'],['mushroom','菇菇寶貝'],['ribbon-pig','緞帶肥肥'],['slime','綠水靈']])variant(name,'docs/play-'+id+'-bubble.png');}
 if(f.id==='weather'){for(const [id,name] of [['sun','晴天'],['rain','下雨'],['snow','飄雪'],['night','星空']])variant(name,'docs/play-weather-'+id+'.png');}
 if(f.id==='boxes'){variant('先記住位置','docs/play-boxes-peek.png');variant('找到夥伴了','docs/play-boxes-found.png');}
 if(f.id==='photo'){variant('明信片','docs/play-postcard-export.png');variant('完整操作視窗','docs/play-window.png');}
}
for(const [i,f] of features.entries()){const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'　'+f.title;b.dataset.id=f.id;b.onclick=()=>select(f);$('features').append(b)}select(features[0]);
</script></html>
