<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>咖凌 · 動畫圖鑑</title>
<style>
:root{color-scheme:light;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#4d2b38;background:#fff6f4}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:0 auto;padding:48px 24px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:40px;margin:8px 0}p{line-height:1.8;color:#815f6d}.tag{letter-spacing:3px;font-size:12px;color:#b65c76}button,a.button{border:1px solid #e9bfc9;border-radius:24px;background:#fff;color:#7c3651;padding:10px 19px;font:inherit;cursor:pointer;text-decoration:none}button:hover,a.button:hover,button[aria-pressed=true]{background:#843e58;color:white;border-color:#843e58}.stage{border:1px solid #efced3;border-radius:30px;background:radial-gradient(ellipse at center,#fff 0%,#fbe1e7 100%);display:grid;place-items:center;min-height:400px;margin:24px 0;position:relative;overflow:hidden}.stage.dark{background:#292634}.stage.checker{background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.sprite{width:192px;height:208px;background:url('spritesheet.png') no-repeat;transform:scale(1.65);transform-origin:center}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.caption{position:absolute;bottom:14px;left:24px;font-size:13px;color:#946b7a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:28px}.card{background:#fff;border:1px solid #f0d9de;border-radius:20px;text-align:center;padding:18px}.card img{width:144px;height:156px;object-fit:contain}.card b{display:block;margin:8px}footer{font-size:13px;color:#8e737e;margin-top:30px}input{accent-color:#a34e6d}a{color:#9b4765}#status{font-size:13px}.error{color:#b32d48;font-weight:bold}@media(max-width:600px){header{display:block}h1{font-size:32px}.stage{min-height:360px}}
</style>
<main><header><div><div class="tag">KALING · DESKTOP COMPANION</div><h1>咖凌，來陪你啦。</h1><p>紅色長髮、金藍異色瞳，還有一點點小心情。<br>選個動作，或讓她跟著你的滑鼠看。</p></div><a class="button" href="使用說明.txt">桌面寵物使用說明 ↗</a></header>
<div class="stage" id="stage"><div class="sprite" id="pet" role="img" aria-label="咖凌動畫"></div><span class="caption" id="caption">待機 · 呼吸與眨眼</span></div>
<div class="controls" id="actions"></div><div class="controls"><button id="pause">暫停</button><button id="look">看向滑鼠</button><button id="bg">切換背景</button><label>大小 <input id="size" type="range" min="1" max="2" step="0.1" value="1.65"></label></div>
<div id="status" aria-live="polite">正在載入動畫…</div><div class="grid" id="gallery"></div>
<footer>完全離線可用 · 9 組動作 / 16 個視線方向 · 在 Windows 請雙擊同資料夾的 Start.vbs 啟動透明桌面寵物。</footer></main>
<script>
const states=[['待機','idle',6,[280,110,110,140,140,320]],['向右跑','running-right',8,[120,120,120,120,120,120,120,220]],['向左跑','running-left',8,[120,120,120,120,120,120,120,220]],['揮手','waving',4,[140,140,140,280]],['跳躍','jumping',5,[140,140,140,140,280]],['失落','failed',8,[140,140,140,140,140,140,140,240]],['等待','waiting',6,[150,150,150,150,150,260]],['思考','running',6,[120,120,120,120,120,220]],['檢查','review',6,[150,150,150,150,150,280]]];
const pet=document.getElementById('pet'),stage=document.getElementById('stage'),caption=document.getElementById('caption');let row=0,frame=0,deadline=0,paused=false,looking=false,bg=0;
function show(r,c){pet.style.backgroundPosition=`${-192*c}px ${-208*r}px`;pet.dataset.row=r;pet.dataset.frame=c}
function select(i){row=i;frame=0;deadline=performance.now()+states[i][3][0];looking=false;show(i,0);caption.textContent=states[i][0];document.querySelectorAll('#actions button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));document.getElementById('look').setAttribute('aria-pressed',false)}
states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>select(i);document.getElementById('actions').append(b);const card=document.createElement('div');card.className='card';const image=document.createElement('img');image.src=`animations/${s[1]}.gif`;image.alt=s[0]+'動畫';const title=document.createElement('b');title.textContent=s[0];card.append(image,title);document.getElementById('gallery').append(card)});
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'播放':'暫停'};
document.getElementById('look').onclick=()=>{looking=!looking;document.getElementById('look').setAttribute('aria-pressed',looking);caption.textContent=looking?'移動滑鼠，咖凌會看向你':'待機';if(!looking)select(0)};
document.getElementById('bg').onclick=()=>{bg=(bg+1)%3;stage.className='stage '+['','dark','checker'][bg]};document.getElementById('size').oninput=e=>pet.style.transform=`scale(${e.target.value})`;
document.addEventListener('pointermove',e=>{if(!looking||paused)return;const p=pet.getBoundingClientRect(),dx=e.clientX-(p.left+p.width/2),dy=e.clientY-(p.top+p.height*.37);if(Math.hypot(dx,dy)<60){show(0,0);return}const angle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360,d=Math.floor((angle+11.25)/22.5)%16;show(9+Math.floor(d/8),d%8);caption.textContent=`看向滑鼠 · ${d*22.5}°`});
const bitmap=new Image();bitmap.onload=()=>{document.getElementById('status').textContent='動畫已載入 · 點選動作即可播放';select(0)};bitmap.onerror=()=>{document.getElementById('status').className='error';document.getElementById('status').textContent='找不到 spritesheet.png，請先解壓縮整個資料夾再開啟。'};bitmap.src='spritesheet.png';
function tick(t){if(!paused&&!looking&&t>=deadline){frame=(frame+1)%states[row][2];show(row,frame);deadline=t+states[row][3][frame]}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
