<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>咖凌 · 動畫圖鑑</title>
<style>
:root{color-scheme:light;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#4d2b38;background:#fff6f4}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:0 auto;padding:48px 24px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:40px;margin:8px 0}p{line-height:1.8;color:#815f6d}.tag{letter-spacing:3px;font-size:12px;color:#b65c76}button,a.button{border:1px solid #e9bfc9;border-radius:24px;background:#fff;color:#7c3651;padding:10px 19px;font:inherit;cursor:pointer;text-decoration:none}button:hover,a.button:hover,button[aria-pressed=true]{background:#843e58;color:white;border-color:#843e58}.stage{border:1px solid #efced3;border-radius:30px;background:radial-gradient(ellipse at center,#fff 0%,#fbe1e7 100%);display:grid;place-items:center;min-height:400px;margin:24px 0;position:relative;overflow:hidden}.stage.dark{background:#292634}.stage.checker{background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.sprite{width:192px;height:208px;background:url('assets/outfits/uniform/atlas.png') no-repeat;transform:scale(1.65);transform-origin:center}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.caption{position:absolute;bottom:14px;left:24px;font-size:13px;color:#946b7a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:28px}.card{background:#fff;border:1px solid #f0d9de;border-radius:20px;text-align:center;padding:18px}.card img{width:144px;height:156px;object-fit:contain}.card b{display:block;margin:8px}footer{font-size:13px;color:#8e737e;margin-top:30px}input{accent-color:#a34e6d}a{color:#9b4765}#status{font-size:13px}.error{color:#b32d48;font-weight:bold}@media(max-width:600px){header{display:block}h1{font-size:32px}.stage{min-height:360px}}
</style>
<main><header><div><div class="tag">KALING · DESKTOP COMPANION</div><h1>咖凌，來陪你啦。</h1><p>紅色長髮、金藍異色瞳，還有一點點小心情。<br>換上喜歡的衣服，再選個動作。每一套都有完整動畫。</p></div><a class="button" href="使用說明.txt">桌面寵物使用說明 ↗</a></header>
<section aria-labelledby="house-title" style="margin:34px 0"><div class="tag">NEW IN 1.3 · COZY HOME</div><h2 id="house-title">咖凌有自己的小屋了。</h2><p>選一件家具，看實際 Windows 小屋錄下的連續動作。啟動桌面版後，右鍵 → 打開生活小屋，即可親手拖動球和紙箱。</p><div class="controls" id="room-actions"></div><img id="room-preview" src="animations/room/bed.gif" alt="咖凌走到床上休息，再探頭起床" style="display:block;width:100%;max-width:720px;border-radius:24px;border:1px solid #efced3"><p id="room-caption" aria-live="polite"></p></section>
<div class="controls" id="outfits" aria-label="選擇服裝"></div>
<div class="stage" id="stage"><div class="sprite" id="pet" role="img" aria-label="咖凌動畫"></div><span class="caption" id="caption">待機 · 呼吸與眨眼</span></div>
<div class="controls" id="actions"></div><div class="controls"><button id="pause">暫停</button><button id="look">看向滑鼠</button><button id="bg">切換背景</button><label>大小 <input id="size" type="range" min="1" max="2" step="0.1" value="1.65"></label></div>
<div id="status" aria-live="polite">正在載入動畫…</div><div class="grid" id="gallery"></div>
<footer>完全離線可用 · 3 套服裝 / 24 組動作 / 16 個視線方向 · 在 Windows 請雙擊同資料夾的 Start.vbs 啟動透明桌面寵物。</footer></main>
<script>
const outfits=[{id:'uniform',name:'經典制服',counts:[6,8,8,4,5,8,6,6,6,8,8,...Array(15).fill(4)]},{id:'pajamas',name:'薰衣草睡衣',counts:[...Array(9).fill(4),8,8,...Array(15).fill(4)]},{id:'hoodie',name:'奶油貓耳帽T',counts:[...Array(9).fill(4),8,8,...Array(15).fill(4)]}];
const states=[['待機',0],['向右走',1],['向左走',2],['揮手',3],['跳躍',4],['失落',5],['等待',6],['思考',7],['檢查',8],['摸頭・害羞',11],['吃餅乾',12],['吃布丁',13],['喝茶',14],['坐下晃腳',15],['抱膝睡覺',16],['揉眼伸懶腰',17],['轉一圈',18],['提起晃腳',19],['探頭',20],['得意歪頭',21],['抱枕放空',22],['被窩探頭',23],['輕碰球',24],['紙箱躲貓貓',25]];
const pet=document.getElementById('pet'),stage=document.getElementById('stage'),caption=document.getElementById('caption'),status=document.getElementById('status');
let outfit=outfits[0],row=0,frame=0,deadline=0,paused=false,looking=false,bg=0,loadVersion=0;
function speed(r){return ({0:220,4:170,11:330,12:300,13:350,14:400,15:300,16:650,17:300,18:180,19:200,20:280,21:550,22:600,23:600,24:300,25:300})[r]||160}
function show(r,c){pet.style.backgroundPosition=`${-192*c}px ${-208*r}px`;pet.dataset.row=r;pet.dataset.frame=c}
function select(i){row=states[i][1];frame=0;deadline=performance.now()+speed(row);looking=false;show(row,0);caption.textContent=outfit.name+' · '+states[i][0];document.querySelectorAll('#actions button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));document.getElementById('look').setAttribute('aria-pressed',false)}
function chooseOutfit(id){
 outfit=outfits.find(o=>o.id===id);const path=`assets/outfits/${id}/atlas.png`,version=++loadVersion;
 pet.style.backgroundImage=`url('${path}')`;document.querySelectorAll('#outfits button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.outfit===id));
 document.querySelectorAll('.card .sprite').forEach(p=>p.style.backgroundImage=`url('${path}')`);
 const bitmap=new Image();status.textContent='正在載入服裝…';bitmap.onload=()=>{if(version!==loadVersion)return;status.className='';status.textContent=outfit.name+' · 動畫已載入'};bitmap.onerror=()=>{if(version!==loadVersion)return;status.className='error';status.textContent='找不到服裝素材，請先解壓縮整個資料夾。'};bitmap.src=path;select(0);
}
outfits.forEach(o=>{const b=document.createElement('button');b.textContent=o.name;b.dataset.outfit=o.id;b.onclick=()=>chooseOutfit(o.id);document.getElementById('outfits').append(b)});
states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>select(i);document.getElementById('actions').append(b);const card=document.createElement('button');card.className='card';card.onclick=()=>select(i);const thumb=document.createElement('div');thumb.className='sprite';thumb.style.transform='scale(.8)';thumb.style.margin='-18px auto';thumb.style.backgroundPosition=`0px ${-208*s[1]}px`;thumb.setAttribute('aria-hidden','true');const title=document.createElement('b');title.textContent=s[0];card.append(thumb,title);document.getElementById('gallery').append(card)});
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'播放':'暫停';document.getElementById('pause').setAttribute('aria-pressed',paused)};
document.getElementById('look').onclick=()=>{looking=!looking;document.getElementById('look').setAttribute('aria-pressed',looking);caption.textContent=looking?'移動滑鼠，咖凌會看向你':'待機';if(!looking)select(0)};
document.getElementById('bg').onclick=()=>{bg=(bg+1)%3;stage.className='stage '+['','dark','checker'][bg]};document.getElementById('size').oninput=e=>pet.style.transform=`scale(${e.target.value})`;
document.addEventListener('pointermove',e=>{if(!looking||paused)return;const p=pet.getBoundingClientRect(),dx=e.clientX-(p.left+p.width/2),dy=e.clientY-(p.top+p.height*.37);if(Math.hypot(dx,dy)<60){show(0,0);return}const angle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360,d=Math.floor((angle+11.25)/22.5)%16;show(9+Math.floor(d/8),d%8);caption.textContent=`看向滑鼠 · ${d*22.5}°`});
function tick(t){if(!paused&&!looking&&t>=deadline){frame=(row===16||row===23)?Math.min(frame+1,outfit.counts[row]-1):(frame+1)%outfit.counts[row];show(row,frame);deadline=t+speed(row)}requestAnimationFrame(tick)}
const roomScenes=[['bed','小床','制服咖凌：走近、鑽被窩、探頭和揉眼起床'],['sofa','沙發','睡衣咖凌：走到沙發，抱枕放空'],['box','紙箱','帽 T 咖凌：探頭、躲進去，再冒出來'],['ball','玩具球','制服咖凌：走近球、輕碰和得意歪頭'],['tea','茶几','睡衣咖凌：走到茶几喝茶']];
roomScenes.forEach(([key,label,description])=>{const button=document.createElement('button');button.textContent=label;button.dataset.scene=key;button.onclick=()=>{document.getElementById('room-preview').src=`animations/room/${key}.gif`;document.getElementById('room-caption').textContent=description;document.querySelectorAll('#room-actions button').forEach(b=>b.setAttribute('aria-pressed',b===button))};document.getElementById('room-actions').append(button)});
document.getElementById('room-actions').children[0].onclick();
chooseOutfit('uniform');requestAnimationFrame(tick);
</script></html>
